  { name = "types-pyinstaller", version = "6.22.1.20260827", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version >= '3.10'" },
]

[package.metadata]
requires-dist = [
  { name = "pyinstaller", marker = "python_full_version < '3.11'", specifier = ">=5" },
  { name = "pyinstaller", marker = "python_full_version == '3.11.*'", specifier = ">=5.5" },
  { name = "pyinstaller", marker = "python_full_version == '3.12.*'", specifier = ">=5.13" },
  { name = "pyinstaller", marker = "python_full_version == '3.13.*'", specifier = ">=5.13" },
  { name = "pyinstaller", marker = "python_full_version == '3.14.*'", specifier = ">=5.13" },
  { name = "pyinstaller", marker = "python_full_version >= '3.15'", specifier = ">=6.21" },
  { name = "typing-extensions", marker = "python_full_version < '3.15'", specifier = ">=4.13.2" },
]

[package.metadata.requires-dev]
docs = [{ name = "pdoc", specifier = ">=15.0.4" }]
lint = [
  { name = "flake8", specifier = ">=7.3.0" },
  { name = "ruff", specifier = ">=0.14.6" },
]
test = [
  { name = "nox", extras = [
    "uv",
  ], specifier = ">=2025.11.12" },
  { name = "pytest-cov", specifier = ">=7.0.0" },
]
typecheck = [
  { name = "mypy", specifier = ">=1.19.0" },
  { name = "pyrefly", specifier = ">=0.43.1" },
  { name = "pyright", specifier = ">=1.1.407" },
  { name = "types-pyinstaller", specifier = ">=6.17.0.20251127" },
]
types = [{ name = "types-pyinstaller", specifier = ">=6.17.0.20251127" }]
